<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>InvenTrack Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#05090e;--bg1:#09111a;--bg2:#0d1822;--bg3:#122030;
  --b1:#1a2e42;--b2:#1f3750;
  --t0:#e8f2fc;--t1:#9bbdd8;--t2:#5a88a8;--t3:#2e5570;
  --acc:#00d4ff;--acc2:#0099ff;
  --ff:'DM Sans',sans-serif;--fm:'JetBrains Mono',monospace;
}
body{background:var(--bg0);color:var(--t0);font-family:var(--ff);min-height:100vh;-webkit-tap-highlight-color:transparent}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scanBeam{0%{top:4%}50%{top:88%}100%{top:4%}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:100;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(5,9,14,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--b1)}
.logo{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:12px;font-weight:700;color:#000}
.logo-text{font-size:15px;font-weight:700;letter-spacing:-.3px}
.logo-text span{color:var(--t2);font-weight:400;font-size:12px}

/* STEP BAR */
.stepbar{display:flex;background:var(--bg1);border-bottom:1px solid var(--b1);overflow-x:auto;padding:0 8px}
.stepbar::-webkit-scrollbar{display:none}
.step-btn{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border:none;background:transparent;color:var(--t3);font-family:var(--ff);font-size:11px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.step-btn.active{color:var(--acc);border-bottom-color:var(--acc)}
.step-btn.done{color:var(--t1)}
.step-n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--fm)}
.step-btn.active .step-n{background:rgba(0,212,255,.12)}
.step-btn.done .step-n{background:rgba(34,197,94,.12);border-color:#22c55e;color:#4ade80}

/* MAIN */
.main{padding:16px;max-width:600px;margin:0 auto}

/* CARD */
.card{background:var(--bg1);border:1px solid var(--b1);border-radius:12px;overflow:hidden;margin-bottom:14px;animation:fadeUp .3s ease}
.card-head{padding:12px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px}
.card-body{padding:16px}

/* DROP ZONE */
.drop-zone{border:2px dashed var(--b2);border-radius:10px;padding:36px 16px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2)}
.drop-zone:active,.drop-zone.over{border-color:var(--acc);background:rgba(0,212,255,.03)}
.drop-icon{font-size:36px;margin-bottom:12px}
.drop-t1{font-size:15px;font-weight:600;margin-bottom:6px}
.drop-t2{font-size:12px;color:var(--t2);font-family:var(--fm)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--ff);border:none;cursor:pointer;transition:all .15s;width:100%;margin-top:8px}
.btn-prime{background:var(--acc);color:#000}
.btn-prime:active{background:#33ddff}
.btn-ghost{background:var(--bg2);color:var(--t1);border:1px solid var(--b2);margin-top:8px}
.btn-green{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.btn-sm{padding:7px 14px;font-size:12px;width:auto;margin-top:0}

/* PROGRESS */
.prog-wrap{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:10px 0 6px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .3s ease;border-radius:2px}

/* INPUT */
.inp{background:var(--bg2);border:1px solid var(--b2);border-radius:8px;padding:11px 14px;font-size:14px;font-family:var(--fm);color:var(--t0);outline:none;width:100%;transition:border-color .2s}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--t3)}
.inp-row{display:flex;gap:8px;margin-bottom:10px}
.inp-sm{width:72px;flex:none}

/* SCAN OPTS */
.scan-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.scan-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:9px;background:var(--bg2);border:1.5px solid var(--b1);cursor:pointer;font-size:11px;font-weight:600;color:var(--t2);transition:all .15s}
.scan-opt.on{border-color:var(--acc);background:rgba(0,212,255,.06);color:var(--acc)}
.scan-opt svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

/* CAMERA */
.cam-wrap{border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;position:relative;margin-bottom:10px;border:1px solid var(--b2)}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-corner{position:absolute;width:24px;height:24px;border:2px solid var(--acc)}
.cam-beam{position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:scanBeam 2.4s ease-in-out infinite;box-shadow:0 0 8px var(--acc)}
.cam-detected{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,.9);color:#000;padding:4px 14px;border-radius:20px;font-family:var(--fm);font-size:12px;font-weight:700;white-space:nowrap}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--b1);background:var(--bg2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--b1);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto;max-height:320px;overflow-y:auto}
.tbl-wrap::-webkit-scrollbar{width:3px;height:3px}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.tc-code{font-family:var(--fm);font-size:11px;color:var(--acc)}
.sz-tag{display:inline-block;padding:1px 6px;border-radius:3px;background:var(--bg3);border:1px solid var(--b2);font-size:10px;font-weight:700;color:var(--t1);font-family:var(--fm)}

/* STATUS */
.st-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--fm);border:1px solid}
.st-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{padding:12px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--b1)}
.stat-v{font-size:24px;font-weight:800;font-family:var(--fm);line-height:1;margin-bottom:3px}
.stat-l{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}

/* LOG */
.log{max-height:240px;overflow-y:auto}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.log-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b1);animation:slideIn .15s ease}
.log-item:last-child{border-bottom:none}
.log-ico{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.log-code{font-family:var(--fm);font-size:11px;color:var(--t1)}
.log-res{font-size:12px;font-weight:500;margin-top:1px}
.log-time{font-family:var(--fm);font-size:10px;color:var(--t3);flex-shrink:0}

/* EXPORT */
.export-box{padding:24px 16px;text-align:center;border-radius:10px;background:rgba(0,212,255,.04);border:1px solid rgba(0,212,255,.12)}
.btn-export{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:9px;background:#22c55e;color:#000;font-size:14px;font-weight:700;font-family:var(--ff);border:none;cursor:pointer;transition:all .15s;margin-top:0;width:auto}
.btn-export:active{background:#4ade80}

/* LEGEND */
.legend-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;margin-bottom:6px;border:1px solid}
.legend-sw{width:12px;height:12px;border-radius:2px;flex-shrink:0}

/* EDIT INP */
.edit-inp{background:var(--bg3);border:1px solid var(--b2);border-radius:4px;padding:3px 7px;font-family:var(--fm);font-size:11px;color:var(--t0);width:52px;outline:none}
.edit-inp:focus{border-color:var(--acc)}

/* TOAST */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9999;width:calc(100% - 32px);max-width:360px}
.toast{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:9px;background:var(--bg2);border:1px solid var(--b2);box-shadow:0 4px 20px rgba(0,0,0,.5);font-size:13px;font-weight:500;animation:pop .22s ease}
.toast-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* MISC */
.div{height:1px;background:var(--b1);margin:12px 0}
.empty{padding:28px;text-align:center;color:var(--t3);font-size:13px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;font-family:var(--fm)}
.srch{margin-bottom:10px}
.nav-bottom{display:flex;justify-content:space-between;padding-top:14px;margin-top:4px;border-top:1px solid var(--b1)}
.ocr-step{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
.ocr-step-dot{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;border:1px solid}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-icon">IT</div>
    <div class="logo-text">InvenTrack <span>Pro</span></div>
  </div>
  <div style="font-size:11px;color:var(--t3);font-family:var(--fm)" id="sessionInfo">Sesión activa</div>
</header>

<div class="stepbar" id="stepbar"></div>

<main class="main" id="main"></main>

<div class="toasts" id="toasts"></div>

<script>
const DEMO = [
  {id:"I01",code:"01BOLSA",desc:"Bolsa",size:"–",qty:3},
  {id:"I02",code:"LC260090",desc:"Blusa",size:"–",qty:3},
  {id:"I03",code:"LC260092",desc:"Pantalón",size:"–",qty:3},
  {id:"I04",code:"LC260250",desc:"Chaleco",size:"–",qty:3},
  {id:"I05",code:"LC260252",desc:"Pantalón",size:"–",qty:3},
  {id:"I06",code:"LC200328",desc:"Top",size:"–",qty:5},
  {id:"I07",code:"LC260329",desc:"Pantalón",size:"–",qty:5},
  {id:"I08",code:"LD03090",desc:"Conjunto",size:"–",qty:1},
  {id:"I09",code:"LD05476",desc:"Chaleco",size:"–",qty:3},
  {id:"I10",code:"LD05478",desc:"Pantalón Corto",size:"–",qty:3},
  {id:"I11",code:"LD05525",desc:"Pantalón Corto",size:"–",qty:3},
  {id:"I12",code:"LD05536",desc:"Vestido",size:"–",qty:4},
  {id:"I13",code:"Y0154",desc:"Vestido",size:"–",qty:2},
  {id:"I14",code:"Y0156",desc:"Blusa",size:"–",qty:2},
  {id:"I15",code:"Y0158",desc:"Pantalón",size:"–",qty:2},
  {id:"I16",code:"Y0159",desc:"Chaqueta",size:"–",qty:3},
  {id:"I17",code:"Y0180",desc:"Chaleco",size:"–",qty:4},
  {id:"I18",code:"Y0161",desc:"Pantalón",size:"–",qty:4},
  {id:"I19",code:"Y0164",desc:"Vestido",size:"–",qty:3},
];

const STATUS = {
  green:{label:"Coincide exacto",color:"#22c55e",bg:"rgba(34,197,94,.12)",border:"rgba(34,197,94,.35)"},
  yellow:{label:"Cantidad diferente",color:"#f59e0b",bg:"rgba(245,158,11,.12)",border:"rgba(245,158,11,.35)"},
  red:{label:"Sin escanear",color:"#ef4444",bg:"rgba(239,68,68,.12)",border:"rgba(239,68,68,.35)"},
  black:{label:"Fuera de factura",color:"#94a3b8",bg:"rgba(148,163,184,.08)",border:"rgba(148,163,184,.2)"},
};

let state = {
  step: 0,
  invoice: JSON.parse(JSON.stringify(DEMO)),
  scanData: [],
  log: [],
  scanMode: "manual",
  camStream: null,
  filterQ: "",
};

const uid = () => Math.random().toString(36).slice(2,8);
const nowT = () => new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"});

function getStatus(iqty, scanned, inInvoice) {
  if (!inInvoice) return "black";
  if (scanned === 0) return "red";
  if (scanned === iqty) return "green";
  return "yellow";
}

function toast(msg, type="success") {
  const cols = {success:"#22c55e",error:"#ef4444",warning:"#f59e0b",info:"#00d4ff"};
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<div class="toast-dot" style="background:${cols[type]||cols.info}"></div><span>${msg}</span>`;
  const wrap = document.getElementById("toasts");
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ── PARSER OCR UNIVERSAL ──
const SKIP = new Set(["REFERENC","REFERENCIA","DESCRIPCIÓN","DESCRIPCION","CANTIDAD","CTOTAL","C.TOTAL","PRECIO","TOTAL","SUBTOTAL","FACTURA","FECHA","NIF","CIF","IVA","DESCUENTO","NOTA","PAGINA","PÁGINA","VISA","GRACIAS","EMAIL","TEL","FAX","SPAIN","ESPAÑA","SCANNED","WITH","IMPORTE","BASE","UNIDADES","UNID","UDS","PVP","EUR","USD","NUMERO","NÚMERO","PEDIDO","ALBARAN","ALBARÁN"]);

function parseOCR(text) {
  const lines = text.split("\n").map(l=>l.trim()).filter(l=>l.length>1);
  const results = []; const seen = new Set();
  for (const line of lines) {
    if (/TOTAL|SUBTOTAL|BASE IMPONIBLE|SIN IVA|IVA\s*\d|PAGINA|PÁGINA/i.test(line)) continue;
    if (/^(calle|c\/|av\.|avda|tel[eé]f|email|www\.|http|nif|cif)/i.test(line)) continue;
    const m = line.match(/^([A-Z0-9][A-Z0-9\-\.\/]{1,19})\s{1,4}(.{2,})/i);
    if (!m) continue;
    const code = m[1].toUpperCase(); const rest = m[2];
    if (SKIP.has(code)) continue;
    if (code.length < 2 || code.length > 20) continue;
    if (/^[A-ZÁÉÍÓÚÑ]+$/.test(code) && code.length > 4) continue;
    if (seen.has(code)) continue;
    const qm = rest.match(/(\d+)\s*[xX×]\s*\d+/) || rest.match(/\b(\d{1,4})\b(?!\s*[,\.]\s*\d{2})/);
    const qty = qm ? parseInt(qm[1]) : 1;
    if (qty <= 0 || qty > 999) continue;
    let desc = rest.replace(/\d+\s*[xX×]\s*\d+/g,"").replace(/\d+[,\.]\d{2}\s*[€$£]?/g,"").replace(/\b\d{1,4}\b/g,"").replace(/[€$£]/g,"").trim();
    const dup = desc.match(/^.+?\s+([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ\s]{3,})$/);
    if (dup) { const u=dup[1].trim(); desc=u[0]+u.slice(1).toLowerCase(); }
    desc = desc.replace(/\s{2,}/g," ").trim() || "Artículo";
    seen.add(code);
    results.push({id:`I${String(results.length+1).padStart(3,"0")}`,code,desc,size:"–",qty});
  }
  return results;
}

async function loadPDFJS() {
  if (window.pdfjsLib) return;
  await new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res()};
    s.onerror=rej;document.head.appendChild(s);
  });
}

async function extractText(file) {
  if (file.type==="application/pdf"||file.name.endsWith(".pdf")) {
    await loadPDFJS();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let txt="";
    for (let p=1;p<=pdf.numPages;p++) {
      const page=await pdf.getPage(p);
      const c=await page.getTextContent();
      const map={};
      for (const i of c.items){const y=Math.round(i.transform[5]/3)*3;if(!map[y])map[y]=[];map[y].push({x:i.transform[4],s:i.str});}
      Object.keys(map).map(Number).sort((a,b)=>b-a).forEach(y=>{txt+=map[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join("  ")+"\n";});
    }
    return txt;
  }
  if (!window.Tesseract) {
    await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  }
  const {data:{text}} = await Tesseract.recognize(file,"spa+eng");
  return text;
}

// ── CAMERA ──
let camStream=null, rafId=null, lastDetected="", zxingReader=null;

async function startCamera() {
  stopCamera();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    camStream=stream;
    const v=document.getElementById("camVideo");
    if(v){v.srcObject=stream;await v.play();}
    document.getElementById("camStatus").textContent="🟢 Cámara activa";
    startZXing();
  } catch(e) {
    let msg="Error al acceder a la cámara";
    if(e.name==="NotAllowedError") msg="Permiso denegado. Actívalo en ajustes del navegador.";
    else if(e.name==="NotFoundError") msg="No se encontró cámara en este dispositivo.";
    document.getElementById("camStatus").textContent="❌ "+msg;
  }
}

function stopCamera() {
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
}

async function startZXing() {
  if(!window.ZXingBrowser&&!window.ZXing) {
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js";
    s.onload=()=>decodeLoop();
    document.head.appendChild(s);
  } else { decodeLoop(); }
}

function decodeLoop() {
  const v=document.getElementById("camVideo");
  const c=document.getElementById("camCanvas");
  if(!v||!c){return;}
  const ZX=window.ZXingBrowser||window.ZXing;
  if(ZX&&ZX.BrowserMultiFormatReader&&!zxingReader){
    try{zxingReader=new ZX.BrowserMultiFormatReader();}catch(e){}
  }
  const loop=()=>{
    if(!camStream){return;}
    try{
      if(v.readyState>=2){
        c.width=v.videoWidth;c.height=v.videoHeight;
        const ctx=c.getContext("2d");ctx.drawImage(v,0,0);
        if(zxingReader&&zxingReader.decodeFromCanvas){
          zxingReader.decodeFromCanvas(c).then(r=>{
            if(r&&r.text&&r.text!==lastDetected){
              lastDetected=r.text;
              const det=document.getElementById("camDetected");
              if(det){det.textContent="✓ "+r.text;det.style.display="block";}
              processScan(r.text,"");
              setTimeout(()=>{lastDetected="";},2000);
            }
          }).catch(()=>{});
        }
      }
    }catch(e){}
    rafId=requestAnimationFrame(loop);
  };
  rafId=requestAnimationFrame(loop);
}

function processScan(code, size) {
  const cleaned = code.trim().toUpperCase();
  if(!cleaned) return;
  const match = state.invoice.find(inv=>
    inv.code===cleaned||
    inv.code.replace(/-/g,"")===cleaned.replace(/-/g,"")||
    cleaned.includes(inv.code.slice(0,8))
  );
  const entry={id:uid(),code:cleaned,size:size||"–",time:nowT(),found:!!match,desc:match?.desc||"No en factura"};
  state.log.unshift(entry);
  if(state.log.length>60) state.log.pop();
  if(match){
    const ex=state.scanData.find(x=>x.code===match.code);
    if(ex){ex.scanned++;}
    else{state.scanData.push({id:match.id,code:match.code,desc:match.desc,size:match.size,invoiceQty:match.qty,scanned:1,inInvoice:true});}
    toast(`✓ ${match.desc} registrado`,"success");
  } else {
    const ex=state.scanData.find(x=>x.code===cleaned&&!x.inInvoice);
    if(ex){ex.scanned++;}
    else{state.scanData.push({id:uid(),code:cleaned,desc:"Desconocido",size:size||"?",invoiceQty:0,scanned:1,inInvoice:false});}
    toast(`⚠ Fuera de factura: ${cleaned}`,"warning");
  }
  if(state.step===1) renderStep();
}

// ── RENDER ──
function renderStepBar() {
  const steps=["Factura","Escanear","Revisar","Exportar"];
  document.getElementById("stepbar").innerHTML=steps.map((s,i)=>`
    <button class="step-btn ${state.step===i?"active":""} ${state.step>i?"done":""}" onclick="goStep(${i})">
      <span class="step-n">${state.step>i?"✓":i+1}</span>
      ${s}
    </button>
  `).join("");
}

function goStep(i){if(i<=state.step||i===state.step){state.step=i;if(i!==1)stopCamera();renderAll();}}

function renderAll(){renderStepBar();renderStep();}

function renderStep(){
  const m=document.getElementById("main");
  if(state.step===0) m.innerHTML=renderStep1();
  else if(state.step===1) m.innerHTML=renderStep2();
  else if(state.step===2) m.innerHTML=renderStep3();
  else m.innerHTML=renderStep4();
  bindStep();
}

  <div class="stats-grid">
    <div class="stat"><div class="stat-v" style="color:${acc>85?"#22c55e":acc>60?"#f59e0b":"#ef4444"}">${acc}%</div><div class="stat-l">Precisión</div></div>

      <span class="pill" style="background:${c.bg};color:${c.color};border:1px solid ${c.border}">${g.length}</span>
    </div>
    <div class="tbl-wrap">
      <table class="tbl"><thead><tr><th>Código</th><th>Desc.</th><th>Fact.</th><th>Esc.</th><th>Dif.</th></tr></thead>
      <tbody>${g.map(r=>{const diff=r.scanned-(r.iqty||0);return`<tr>
        <td class="tc-code">${r.code}</td>
        <td style="font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.desc}</td>
        <td style="font-family:var(--fm);font-weight:600">${r.iqty??'—'}</td>
        <td style="font-family:var(--fm);font-weight:600;color:${s==="green"?"#4ade80":"var(--t0)"}">${r.scanned}</td>
        <td style="font-family:var(--fm);font-size:11px;color:${diff===0?"var(--t3)":diff>0?"#22c55e":"#ef4444"}">${diff===0?"—":diff>0?"+"+diff:diff}</td>
      </tr>`}).join("")}</tbody></table>
    </div>
  </div>`}).join("")}

    <button class="btn btn-ghost btn-sm" onclick="goStep(1)">← Escanear</button>
    <button class="btn btn-prime btn-sm" onclick="goStep(3)">Exportar →</button>
  </div>`;
}

// STEP 4
function renderStep4(){
  const rows=state.invoice.map(inv=>{const sc=state.scanData.find(s=>s.code===inv.code);const scanned=sc?.scanned||0;return{code:inv.code,desc:inv.desc,size:inv.size,iqty:inv.qty,scanned,status:getStatus(inv.qty,scanned,true)};});

  const all=[...rows,...extras];

    <div class="stat"><div class="stat-v" style="color:var(--acc)">${all.reduce((a,r)=>a+r.scanned,0)}</div><div class="stat-l">Escaneadas</div></div>

    <div class="tbl-wrap">

        <td class="tc-code">${r.code}</td>
        <td style="font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.desc}</td>

        <td style="font-family:var(--fm);color:${c.color};font-weight:600">${r.scanned}</td>
        <td><div style="width:10px;height:10px;border-radius:2px;background:${c.color}"></div></td>
      </tr>`}).join("")}</tbody></table>
      ${all.length>10?`<div style="padding:8px;font-size:11px;color:var(--t3);text-align:center">+${all.length-10} filas más en el CSV</div>`:""}
    </div>
  </div>
  <div class="nav-bottom">
    <button class="btn btn-ghost btn-sm" onclick="goStep(2)">← Revisar</button>
    <button class="btn btn-ghost btn-sm" onclick="newSession()">🔄 Nueva sesión</button>

}

function downloadCSV(){
  if(!window._csvData)return;
  const csv=window._csvData.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;
  a.download=`inventario-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("✓ CSV descargado — ábrelo en Google Sheets","success");
}

function newSession(){stopCamera();state={...state,scanData:[],log:[],step:0};renderAll();}

function bindStep(){
  // Bind file input
  const dz=document.getElementById("dropZone");
  const fi=document.getElementById("fileInp");
  const db=document.getElementById("demoBtn");
  if(dz){
    dz.addEventListener("click",()=>fi.click());
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over")});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");const f=e.dataTransfer.files[0];if(f)handleFile(f);});
  }
  if(fi) fi.addEventListener("change",e=>{if(e.target.files[0])handleFile(e.target.files[0]);});
  if(db) db.addEventListener("click",()=>{state.invoice=JSON.parse(JSON.stringify(DEMO));showOCRResult(state.invoice);});
  // Bind camera video show
  const cv=document.getElementById("camVideo");
  if(cv&&camStream){cv.srcObject=camStream;cv.style.display="block";}
}

async function handleFile(f){
  showOCRProgress(f.name);
  try{
    const text=await extractText(f);
    const parsed=parseOCR(text);
    if(parsed.length===0){toast("No se detectaron artículos. Revisa el PDF.","warning");state.invoice=JSON.parse(JSON.stringify(DEMO));}
    else{state.invoice=parsed;}
    showOCRResult(state.invoice);
  }catch(e){
    toast("Error leyendo el archivo","error");
    state.invoice=JSON.parse(JSON.stringify(DEMO));
    showOCRResult(state.invoice);
  }
}

// Init
renderAll();
</script>
