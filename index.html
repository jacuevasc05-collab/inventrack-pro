<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>InvenTrack Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg0:#05090e;--bg1:#09111a;--bg2:#0d1822;--bg3:#122030;--b1:#1a2e42;--b2:#1f3750;--t0:#e8f2fc;--t1:#9bbdd8;--t2:#5a88a8;--t3:#2e5570;--acc:#00d4ff;--acc2:#0099ff;--ff:'Familjen Grotesk',sans-serif;--fm:'JetBrains Mono',monospace}
body{background:var(--bg0);color:var(--t0);font-family:var(--ff);min-height:100vh;-webkit-text-size-adjust:100%;padding-bottom:40px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scanBeam{0%{top:0}50%{top:90%}100%{top:0}}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.topbar{position:sticky;top:0;z-index:100;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(5,9,14,.95);border-bottom:1px solid var(--b1)}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000}
.logo-text{font-size:14px;font-weight:700}
.logo-text span{color:var(--t2);font-weight:400}
.stepbar{display:flex;background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:4px;margin:12px 12px 0}
.step{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px;border-radius:7px;cursor:pointer;transition:background .2s}
.step.active{background:var(--bg3)}
.step-n{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--fm);border:1.5px solid var(--b2);color:var(--t3);flex-shrink:0}
.step.active .step-n{border-color:var(--acc);color:var(--acc);background:rgba(0,212,255,.1)}
.step.done .step-n{border-color:#22c55e;background:rgba(34,197,94,.12);color:#4ade80}
.step-lbl{font-size:10px;font-weight:500;color:var(--t3)}
.step.active .step-lbl{color:var(--t0)}
.step.done .step-lbl{color:var(--t1)}
.main{padding:12px}
.card{background:var(--bg1);border:1px solid var(--b1);border-radius:11px;overflow:hidden;animation:fadeUp .3s ease;margin-bottom:12px}
.card-head{padding:12px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px}
.card-body{padding:16px}
.drop-zone{border:2px dashed var(--b2);border-radius:9px;padding:32px 16px;text-align:center;cursor:pointer;background:var(--bg2)}
.prog-wrap{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:10px 0 5px}
.prog-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .35s ease}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;font-family:var(--ff);border:none;cursor:pointer;min-height:48px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-prime{background:var(--acc);color:#000}
.btn-prime:active{background:#33ddff}
.btn-ghost{background:var(--bg2);color:var(--t1);border:1px solid var(--b2)}
.btn-ghost:active{background:var(--bg3)}
.btn-full{width:100%}
.inp{background:var(--bg2);border:1px solid var(--b2);border-radius:8px;padding:12px 13px;font-size:16px;font-family:var(--fm);color:var(--t0);outline:none;width:100%;-webkit-appearance:none;min-height:48px}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--t3)}
.inp-row{display:flex;gap:8px;margin-bottom:10px}
.inp-sm{width:80px!important;flex-shrink:0}
.scan-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.scan-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:9px;background:var(--bg2);border:1.5px solid var(--b1);cursor:pointer;font-size:11px;font-weight:600;color:var(--t2);min-height:70px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.scan-opt.on{border-color:var(--acc);background:rgba(0,212,255,.06);color:var(--acc)}
.cam-frame{border-radius:9px;overflow:hidden;background:#000;aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid var(--b2);margin-bottom:10px}
.cam-corner{position:absolute;width:24px;height:24px;border:2px solid var(--acc)}
.cam-beam{position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:scanBeam 2.4s ease-in-out infinite}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;border-bottom:1px solid var(--b1);background:var(--bg2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--b1);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tc-code{font-family:var(--fm);font-size:10px;color:var(--acc)}
.tc-desc{font-weight:500;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sz-tag{display:inline-block;padding:1px 6px;border-radius:3px;background:var(--bg3);border:1px solid var(--b2);font-size:9px;font-weight:700;color:var(--t1);font-family:var(--fm)}
.st-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;font-family:var(--fm);border:1px solid}
.st-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{padding:12px 14px;border-radius:9px;background:var(--bg2);border:1px solid var(--b1)}
.stat-v{font-size:22px;font-weight:800;font-family:var(--fm);line-height:1;margin-bottom:2px}
.stat-l{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase}
.log{max-height:200px;overflow-y:auto}
.log-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b1)}
.log-item:last-child{border-bottom:none}
.log-ico{width:26px;height:26px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.edit-inp{background:var(--bg3);border:1px solid var(--b2);border-radius:4px;padding:3px 6px;font-family:var(--fm);font-size:11px;color:var(--t0);width:50px;outline:none}
.sheets-card{padding:24px 16px;text-align:center;border-radius:10px;background:rgba(0,212,255,.04);border:1px solid rgba(0,212,255,.12)}
.btn-export{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:8px;background:#22c55e;color:#000;font-size:14px;font-weight:700;font-family:var(--ff);border:none;cursor:pointer;touch-action:manipulation}
.nav-bottom{display:flex;justify-content:space-between;gap:10px;padding-top:14px;margin-top:6px;border-top:1px solid var(--b1)}
.nav-bottom .btn{flex:1}
.toasts{position:fixed;bottom:20px;right:12px;display:flex;flex-direction:column;gap:7px;z-index:9999;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;min-width:200px;max-width:280px;background:var(--bg2);border:1px solid var(--b2);box-shadow:0 4px 16px rgba(0,0,0,.6);font-size:12px;font-weight:500;animation:toastIn .2s ease}
.toast-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.div{height:1px;background:var(--b1);margin:12px 0}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;font-family:var(--fm)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.legend-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;margin-bottom:5px;border:1px solid}
.legend-swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0}
.fmt-row{display:flex;gap:5px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.fmt{padding:2px 8px;border-radius:4px;background:var(--bg3);border:1px solid var(--b2);font-size:10px;color:var(--t2);font-family:var(--fm)}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">
    <div class="logo-icon">IT</div>
    <div class="logo-text">InvenTrack <span>Pro</span></div>
  </div>
  <div id="ctr" style="font-size:11px;color:var(--t3);font-family:var(--fm)"></div>
</header>
<div class="stepbar" id="sb"></div>
<main class="main" id="mc"></main>
<div class="toasts" id="toasts"></div>

<script>
// ═══ STATE ═══
const DI=[
  {id:"I01",code:"01BOLSA",desc:"Bolsa",size:"–",qty:3},
  {id:"I02",code:"LC260090",desc:"Blusa",size:"–",qty:3},
  {id:"I03",code:"LC260092",desc:"Pantalón",size:"–",qty:3},
  {id:"I04",code:"LC260250",desc:"Chaleco",size:"–",qty:3},
  {id:"I05",code:"LC260252",desc:"Pantalón",size:"–",qty:3},
  {id:"I06",code:"LC200328",desc:"Top",size:"–",qty:5},
  {id:"I07",code:"LC260329",desc:"Pantalón",size:"–",qty:5},
  {id:"I08",code:"LD03090",desc:"Conjunto",size:"–",qty:1},
  {id:"I09",code:"LD05476",desc:"Chaleco",size:"–",qty:3},
  {id:"I10",code:"LD05478",desc:"Pantalón Corto",size:"–",qty:3},
  {id:"I11",code:"LD05525",desc:"Pantalón Corto",size:"–",qty:3},
  {id:"I12",code:"LD05536",desc:"Vestido",size:"–",qty:4},
  {id:"I13",code:"Y0154",desc:"Vestido",size:"–",qty:2},
  {id:"I14",code:"Y0156",desc:"Blusa",size:"–",qty:2},
  {id:"I15",code:"Y0158",desc:"Pantalón",size:"–",qty:2},
  {id:"I16",code:"Y0159",desc:"Chaqueta",size:"–",qty:3},
  {id:"I17",code:"Y0180",desc:"Chaleco",size:"–",qty:4},
  {id:"I18",code:"Y0161",desc:"Pantalón",size:"–",qty:4},
  {id:"I19",code:"Y0164",desc:"Vestido",size:"–",qty:3},
];
const ST={
  green:{label:"Coincide exacto",color:"#22c55e",bg:"rgba(34,197,94,.12)",border:"rgba(34,197,94,.35)"},
  yellow:{label:"Cant. diferente",color:"#f59e0b",bg:"rgba(245,158,11,.12)",border:"rgba(245,158,11,.35)"},
  red:{label:"Sin escanear",color:"#ef4444",bg:"rgba(239,68,68,.12)",border:"rgba(239,68,68,.35)"},
  black:{label:"Fuera de factura",color:"#94a3b8",bg:"rgba(148,163,184,.08)",border:"rgba(148,163,184,.2)"},
};
let S={step:0,inv:DI.map(x=>({...x})),scans:[],log:[],mode:"manual",stream:null,camOn:false,fq:""};
const uid=()=>Math.random().toString(36).slice(2,9);
const nt=()=>new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
function gst(iq,sc,inInv){if(!inInv)return"black";if(sc===0)return"red";if(sc===iq)return"green";return"yellow";}

// ═══ PARSER OCR ═══
const HW=new Set(["REFERENC","REFERENCIA","REF","DESCRIPCIÓN","DESCRIPCION","CANTIDAD","CTOTAL","C.TOTAL","PRECIO","TOTAL","SUBTOTAL","FACTURA","FECHA","NIF","CIF","IVA","DESCUENTO","NOTA","PAGINA","PÁGINA","VISA","GRACIAS","EMAIL","TEL","FAX","SPAIN","ESPAÑA","SCANNED","WITH","CAMSCANNER","IMPORTE","BASE","ARTICULO","ARTÍCULO","UNIDADES","UNID","UDS","PVP","EUR","USD","NOMBRE","CLIENTE","PROVEEDOR","DIRECCION","CALLE","CP","CIUDAD","NUMERO","PEDIDO","ORDER"]);
function parseOCR(text){const lines=text.split("\n").map(l=>l.trim()).filter(l=>l.length>1);const res=[];const seen=new Set();for(const line of lines){if(isHdr(line))continue;const e=exLine(line);if(!e||seen.has(e.code))continue;seen.add(e.code);res.push({id:"I"+String(res.length+1).padStart(3,"0"),code:e.code,desc:e.desc,size:e.size,qty:e.qty});}return res;}
function isHdr(l){const up=l.toUpperCase().replace(/[^A-Z0-9\s]/g," ");const ws=up.split(/\s+/).filter(Boolean);if(ws.filter(w=>HW.has(w)).length>=2)return true;if(/TOTAL|SUBTOTAL|BASE IMPONIBLE|SIN IVA|IVA\s+\d/i.test(l))return true;if(/^(calle|c\/|av\.|tel|email|www\.|nif|cif|es\d{9})/i.test(l))return true;return false;}
function exLine(line){const c=line.replace(/[""''`]/g,"").trim();const m=c.match(/^([A-Z0-9][A-Z0-9\-\.\/]{1,19})\s{1,4}(.{2,})/i);if(m){const code=m[1].toUpperCase();const rest=m[2];if(!HW.has(code)&&isVC(code)){const q=exQ(rest);if(q!==null&&q>0)return{code,desc:clnD(rest,q)||"Artículo",size:exSz(c),qty:q};}}const n=c.match(/^(\d{4,13})\s+(.{3,})/);if(n){const q=exQ(n[2]);if(q!==null&&q>0)return{code:n[1],desc:clnD(n[2],q)||"Artículo",size:exSz(c),qty:q};}return null;}
function isVC(c){if(c.length<2||c.length>20)return false;if(HW.has(c))return false;if(/^[A-ZÁÉÍÓÚÑ]+$/.test(c)&&c.length>4)return false;if(!/\d/.test(c)&&c.length>5)return false;return true;}
function exQ(s){const m=s.match(/\b(\d{1,4})\s*[xX×]\s*\d+/);if(m)return parseInt(m[1]);const ns=[...s.matchAll(/\b(\d{1,4})\b(?!\s*[,\.]\s*\d{2})/g)];for(const x of ns){const n=parseInt(x[1]);if(n>=1&&n<=999)return n;}return null;}
function exSz(s){const t=s.match(/\b(XXL|XXXL|XL|XS|[SML])\b/);if(t)return t[1].toUpperCase();const n=s.match(/\b(4[0-8]|3[4-9]|2[8-9]|30|32)\b/);if(n)return n[1];return"–";}
function clnD(raw,qty){let d=raw.replace(/\b\d+\s*[xX×]\s*\d+\b/g,"").replace(/\d{1,3}(?:[.,]\d{3})*[.,]\d{2}\s*[€$£]?/g,"").replace(/[€$£%|]/g,"").replace(new RegExp("\\b"+qty+"\\b","g"),"").replace(/\b\d{1,6}\b/g,"").replace(/\s{2,}/g," ").trim();const dp=d.match(/^.+?\s+([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ\s]{3,})$/);if(dp){const u=dp[1].trim();d=u[0].toUpperCase()+u.slice(1).toLowerCase();}if(d&&d[0])d=d[0].toUpperCase()+d.slice(1);return d.length>=2?d:"";}

// ═══ PDF / OCR ═══
function ldSc(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]')){res();return;}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function exText(file){if(file.type==="application/pdf"||file.name.endsWith(".pdf")){if(!window.pdfjsLib){await ldSc("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}const buf=await file.arrayBuffer();const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;let text="";for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const content=await page.getTextContent();const lm={};for(const item of content.items){const y=Math.round(item.transform[5]/3)*3;if(!lm[y])lm[y]=[];lm[y].push({x:item.transform[4],str:item.str});}const ys=Object.keys(lm).map(Number).sort((a,b)=>b-a);for(const y of ys){const sorted=lm[y].sort((a,b)=>a.x-b.x);const lt=sorted.map(i=>i.str).join("  ");if(lt.trim())text+=lt+"\n";}text+="\n";}return text;}else{if(!window.Tesseract)await ldSc("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js");const{data:{text}}=await window.Tesseract.recognize(file,"spa+eng");return text;}}

// ═══ TOAST ═══
function toast(msg,type){const cols={success:"#22c55e",error:"#ef4444",warning:"#f59e0b",info:"#00d4ff"};const el=document.createElement("div");el.className="toast";el.innerHTML='<div class="toast-dot" style="background:'+(cols[type]||cols.info)+'"></div><span>'+msg+'</span>';document.getElementById("toasts").appendChild(el);setTimeout(()=>el.remove(),3500);}

// ═══ RENDER ═══
function render(){rSB();rStep();rCtr();}
function rCtr(){const t=S.scans.reduce((a,b)=>a+b.scanned,0);document.getElementById("ctr").textContent=t>0?t+" escaneadas":"";}
function rSB(){const steps=["Factura","Escanear","Revisar","Exportar"];document.getElementById("sb").innerHTML=steps.map((s,i)=>'<div class="step '+(S.step===i?"active":"")+(S.step>i?" done":"")+(S.step>i?' onclick="navTo('+i+')"':"")+'" ><div class="step-n">'+(S.step>i?"✓":i+1)+'</div><span class="step-lbl">'+s+'</span></div>').join("");}

// ═══ NAVIGATION — central, no inline state mutation in HTML ═══
function navTo(n){
  stopCam();
  S.step=n;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function rStep(){
  const c=document.getElementById("mc");
  if(S.step===0)c.innerHTML=rS1();
  else if(S.step===1)c.innerHTML=rS2();
  else if(S.step===2)c.innerHTML=rS3();
  else c.innerHTML=rS4();
  bindEv();
}

// ═══ STEP 1 ═══
function rS1(){
  const items=S.inv;
  const fq=S.fq.toLowerCase();
  const filtered=items.filter(it=>!fq||it.code.toLowerCase().includes(fq)||it.desc.toLowerCase().includes(fq));
  return '<div class="card"><div class="card-head"><span class="card-title">📄 Subir Factura</span><span class="pill" style="background:rgba(0,212,255,.1);color:var(--acc);border:1px solid rgba(0,212,255,.2)">OCR IA</span></div><div class="card-body">'
    +'<div class="drop-zone" onclick="document.getElementById(\'fi\').click()">'
    +'<input type="file" id="fi" accept=".pdf,image/*" style="display:none" onchange="handleFile(this.files[0])">'
    +'<div style="font-size:36px;margin-bottom:10px">📄</div>'
    +'<div style="font-size:15px;font-weight:600;margin-bottom:5px">Toca para subir factura</div>'
    +'<div style="font-size:12px;color:var(--t2);font-family:var(--fm)">PDF, JPG, PNG</div>'
    +'<div class="fmt-row"><span class="fmt">PDF</span><span class="fmt">JPG</span><span class="fmt">PNG</span></div></div>'
    +'<div class="div"></div>'
    +'<button class="btn btn-ghost btn-full" onclick="loadDemo()" style="margin-bottom:12px">📋 Cargar factura de ejemplo (19 artículos)</button>'
    +(items.length>0
      ? '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between"><span>Productos detectados</span><span style="color:var(--acc);font-family:var(--fm)">'+items.length+' artículos</span></div>'
        +'<input class="inp" placeholder="🔍 Buscar..." id="fqi" value="'+S.fq+'" oninput="S.fq=this.value;rStep()" style="margin-bottom:8px;font-size:14px">'
        +'<div class="tbl-wrap" style="max-height:260px;overflow-y:auto"><table class="tbl"><thead><tr><th>#</th><th>Código</th><th>Descripción</th><th>Cant.</th></tr></thead><tbody>'
        +filtered.map((it,i)=>'<tr><td style="color:var(--t3);font-family:var(--fm);font-size:10px">'+String(i+1).padStart(2,"0")+'</td><td class="tc-code">'+it.code+'</td><td class="tc-desc">'+it.desc+' <span class="sz-tag">'+it.size+'</span></td><td><input class="edit-inp" value="'+it.qty+'" onchange="editQty(\''+it.id+'\',this.value)" style="width:44px"></td></tr>').join("")
        +'</tbody></table></div>'
        +'<button class="btn btn-ghost btn-full" onclick="addItem()" style="margin-top:8px;font-size:12px">+ Añadir artículo</button>'
        +'<div class="div"></div>'
        +'<button class="btn btn-prime btn-full" onclick="confInv()">Confirmar factura ›</button>'
      : '')
    +'</div></div><div id="ocrp"></div>';
}

function handleFile(file){
  if(!file)return;
  const p=document.getElementById("ocrp");

// ═══ SCAN ═══
function setSM(m){if(S.mode==="camera"&&m!=="camera")stopCam();S.mode=m;rStep();if(m==="manual")setTimeout(function(){const i=document.getElementById("si");if(i)i.focus();},150);}

function doScan(){
  const i=document.getElementById("si");
  const sz=document.getElementById("sz");
  if(!i)return;
  const code=(i.value||"").trim().toUpperCase();
  const size=(sz?sz.value||"":"").trim()||"–";
  if(!code){toast("Escribe o escanea un código primero","warning");return;}
  procScan(code,size);
  i.value="";
  if(sz)sz.value="";
  setTimeout(function(){if(i)i.focus();},100);
}

function demoSc(){
  const p=S.inv.filter(function(inv){const d=S.scans.find(function(s){return s.code===inv.code;});return!d||d.scanned<inv.qty;});
  if(!p.length){toast("Todas las prendas escaneadas 🎉","info");return;}
  const pick=p[Math.floor(Math.random()*p.length)];
  procScan(pick.code,pick.size);
}

function procScan(code,size){
  code=(code||"").toUpperCase().trim();
  if(!code)return;
  const match=S.inv.find(function(inv){
    const a=inv.code.toUpperCase();
    const b=code;
    return a===b||a.replace(/[-\s]/g,"")===b.replace(/[-\s]/g,"")||b.startsWith(a)||a.startsWith(b);
  });
  const entry={id:uid(),code:code,size:size||"–",time:nt(),found:!!match,desc:match?match.desc:"No en factura"};
  S.log=[entry].concat(S.log.slice(0,59));
  if(match){
    const ex=S.scans.find(function(x){return x.code===match.code;});
    if(ex)S.scans=S.scans.map(function(x){return x.code===match.code?Object.assign({},x,{scanned:x.scanned+1}):x;});
    else S.scans=S.scans.concat([{id:match.id,code:match.code,desc:match.desc,size:match.size,invoiceQty:match.qty,scanned:1,inInvoice:true}]);
    toast("✓ "+match.desc+" ["+match.size+"]","success");
  } else {
    const ex=S.scans.find(function(x){return x.code===code&&!x.inInvoice;});
    if(ex)S.scans=S.scans.map(function(x){return x.code===code?Object.assign({},x,{scanned:x.scanned+1}):x;});
    else S.scans=S.scans.concat([{id:uid(),code:code,desc:"Desconocido",size:size||"?",invoiceQty:0,scanned:1,inInvoice:false}]);
    toast("⚠ Fuera de factura: "+code,"warning");
  }
  rCtr();
  // Actualizar log en DOM sin re-render completo
  const sl=document.getElementById("sl");
  if(sl){
    const em=sl.querySelector("div[style*='text-align:center']");
    if(em)em.remove();
    const item=document.createElement("div");
    item.className="log-item";
    item.innerHTML='<div class="log-ico" style="background:'+(match?"rgba(34,197,94,.1)":"rgba(245,158,11,.1)")+';border:1px solid '+(match?"rgba(34,197,94,.25)":"rgba(245,158,11,.25)")+';color:'+(match?"#4ade80":"#f59e0b")+'">'+(match?"✓":"⚠")+'</div>'
      +'<div style="flex:1;min-width:0"><div style="font-family:var(--fm);font-size:10px;color:var(--t1)">'+code+' <span class="sz-tag" style="font-size:8px">'+size+'</span></div>'
      +'<div style="font-size:12px;font-weight:500;color:'+(match?"var(--t0)":"#f59e0b")+'">'+entry.desc+'</div></div>'
      +'<div style="font-family:var(--fm);font-size:9px;color:var(--t3)">'+entry.time+'</div>';
    sl.insertBefore(item,sl.firstChild);
  }
  // Actualizar stats sin re-render
  const svs=document.querySelectorAll(".stat-v");
  if(svs.length>=4){
    svs[0].textContent=S.scans.reduce(function(a,b){return a+b.scanned;},0);
    svs[1].textContent=S.inv.filter(function(inv){const sc=S.scans.find(function(s){return s.code===inv.code;});return sc&&sc.scanned===inv.qty;}).length;
    svs[2].textContent=S.inv.filter(function(inv){const sc=S.scans.find(function(s){return s.code===inv.code;});return!sc||sc.scanned<inv.qty;}).length;
    svs[3].textContent=S.scans.filter(function(s){return!s.inInvoice;}).length;
  }
}

// ═══ CAMERA ═══
let fMode="environment",rafId=null,zxR=null;

async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Tu navegador no soporta cámara","error");return;}
  try{
    if(S.stream){S.stream.getTracks().forEach(function(t){t.stop();});S.stream=null;}
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:fMode},width:{ideal:1280},height:{ideal:720}},audio:false});
    S.stream=stream;S.camOn=true;rStep();
    setTimeout(async function(){
      const v=document.getElementById("cv");
      if(v){v.srcObject=stream;await v.play();}
      ldZX();startDec();
    },200);
  }catch(err){
    if(err.name==="NotAllowedError")toast("Permiso denegado — actívalo en ajustes del navegador","error");
    else if(err.name==="NotFoundError")toast("No se encontró ninguna cámara","error");
    else toast("Error cámara: "+err.message,"error");
  }
}
function stopCam(){if(S.stream){S.stream.getTracks().forEach(function(t){t.stop();});S.stream=null;}if(rafId){cancelAnimationFrame(rafId);rafId=null;}S.camOn=false;}
function swCam(){fMode=fMode==="environment"?"user":"environment";stopCam();S.camOn=false;startCam();}
function ldZX(){if(window.ZXingBrowser||window.__ZXing__)return;const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js";s.onload=function(){window.__ZXing__=window.ZXingBrowser;};document.head.appendChild(s);}
function startDec(){
  function dec(){
    const v=document.getElementById("cv"),c=document.getElementById("cc");
    if(!v||!c||v.readyState<2){rafId=requestAnimationFrame(dec);return;}
    c.width=v.videoWidth;c.height=v.videoHeight;
    const ctx=c.getContext("2d");ctx.drawImage(v,0,0);
    const ZX=window.ZXingBrowser||window.__ZXing__;
    if(ZX){try{if(!zxR&&ZX.BrowserMultiFormatReader)zxR=new ZX.BrowserMultiFormatReader();if(zxR&&zxR.decodeFromCanvas){zxR.decodeFromCanvas(c).then(function(r){if(r&&r.text){const el=document.getElementById("cr");if(el){el.textContent="✓ "+r.text;el.style.display="block";setTimeout(function(){if(el)el.style.display="none";},1500);}procScan(r.text,"–");}}).catch(function(){});}}catch(e){}}
    rafId=requestAnimationFrame(dec);
  }
  rafId=requestAnimationFrame(dec);
}

function bindEv(){
  if(S.camOn&&S.step===1){
    setTimeout(function(){
      const v=document.getElementById("cv");
      if(v&&S.stream){v.srcObject=S.stream;v.play().catch(function(){});}
      if(rafId){cancelAnimationFrame(rafId);rafId=null;}
      startDec();
    },100);
  }
  // Lector de barras: detectar Enter automático del lector en el campo si no lo ve el keydown
  const si=document.getElementById("si");
  if(si&&S.mode==="barcode"){
    si.addEventListener("change",function(){if(this.value.trim())doScan();});
  }
}

render();
</script>
